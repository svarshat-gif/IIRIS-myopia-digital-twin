services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myopia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: myopia_twin
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U myopia -d myopia_twin]
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    build: ./backend
    depends_on:
      db: {condition: service_healthy}
    environment:
      DATABASE_URL: postgresql+psycopg://myopia:${POSTGRES_PASSWORD:-local-development-only}@db:5432/myopia_twin
      ENVIRONMENT: development
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env}
      AUTH_GATE: jwt
      CORS_ORIGINS: http://localhost:8080
      LLM_PROVIDER: none
      EVIDENCE_OFFLINE: ${EVIDENCE_OFFLINE:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports: [127.0.0.1:8000:8000]
    volumes: [uploads:/app/artifacts/uploads]
  ui:
    build: ./frontend
    depends_on:
      api: {condition: service_healthy}
    ports: [127.0.0.1:8080:8080]
volumes:
  pgdata:
  uploads:
